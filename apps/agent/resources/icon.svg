<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Cyan Ribbon Gradient -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Emerald Sync Ribbon Gradient -->
    <linearGradient id="emeraldRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Soft Glow Aura -->
  <circle cx="256" cy="256" r="160" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="90" fill="#10b981" opacity="0.1" filter="url(#glow)" />

  <!-- Center Geometric Sync Bridge / Double Infinity Loop -->
  <g transform="translate(0, 0)">
    <!-- Top-Left to Bottom-Right Sync Arc (Cyan Loop) -->
    <path
      d="M 176 160 C 120 160 84 204 84 256 C 84 308 120 352 176 352 C 228 352 268 304 292 256 C 316 208 356 160 408 160 C 464 160 500 204 500 256 C 500 308 464 352 408 352"
      fill="none"
      stroke="url(#cyanRibbon)"
      stroke-width="36"
      stroke-linecap="round"
      transform="scale(0.8) translate(64, 64)"
    />

    <!-- Intersecting Emerald Arc (Reverse Pulse) -->
    <path
      d="M 336 352 C 392 352 428 308 428 256 C 428 204 392 160 336 160 C 284 160 244 208 220 256 C 196 304 156 352 104 352"
      fill="none"
      stroke="url(#emeraldRibbon)"
      stroke-width="36"
      stroke-linecap="round"
      transform="scale(0.8) translate(64, 64)"
    />

    <!-- Sync Nodes (Data Pulses) -->
    <circle cx="160" cy="256" r="16" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="160" cy="256" r="9" fill="#ffffff" />

    <circle cx="352" cy="256" r="16" fill="#34d399" filter="url(#glow)" />
    <circle cx="352" cy="256" r="9" fill="#ffffff" />

    <circle cx="256" cy="256" r="18" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="256" cy="256" r="10" fill="#ffffff" />
  </g>
</svg>
